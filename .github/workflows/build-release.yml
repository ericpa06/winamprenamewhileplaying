name: Build Winamp File Share Unlocker
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x86
        run: cmake -S . -B build-x86 -A Win32
      - name: Build
        run: cmake --build build-x86 --config Release --parallel
      - name: Test
        run: ctest --test-dir build-x86 -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $dll = 'build-x86/bin/gen_fileunlock.dll'
          if (!(Test-Path $dll)) { throw "DLL missing: $dll" }
          Copy-Item $dll dist/gen_fileunlock-x86.dll
          Get-FileHash dist/gen_fileunlock-x86.dll -Algorithm SHA256 | Format-List | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: gen_fileunlock-x86
          path: dist/gen_fileunlock-x86.dll
          if-no-files-found: error
          retention-days: 30
      - name: Publish release asset for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/gen_fileunlock-x86.dll --repo $env:GITHUB_REPOSITORY --title "Winamp File Share Unlocker $env:GITHUB_REF_NAME" --generate-notes
